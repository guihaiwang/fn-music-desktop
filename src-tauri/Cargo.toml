[package]
name = "feiniu-music-desktop"
version = "0.1.0"
description = "飞牛音乐"
authors = ["foolin"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "feiniu_music_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers：允许 JS 侧设置 Cookie 等被 fetch 规范禁止的头（飞牛音乐 API 需要 Cookie: music-token 鉴权）
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# NAS 图片代理（fetch_nas_image 命令）：后端携带 music-token 拉取封面/照片返回前端
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
base64 = "0.22"
tauri-plugin-os = "2"

[target."cfg(target_os = \"windows\")".dependencies]
tauri-plugin-snap-layout = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
